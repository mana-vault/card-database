# Hooks for this repository, run by prek (https://github.com/j178/prek).
repos = [
  { repo = "local", hooks = [
      { id = "markdownlint-cli2",
        name = "markdownlint-cli2",
        language = "system",
        entry = "mise exec -- markdownlint-cli2",
        files = '\.md$',
        require_serial = true },
  ] },
]
