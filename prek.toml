# Hooks for this repository, run by prek (https://github.com/j178/prek).
# Every hook runs one check over the files the commit touches; each check is the same
# one as the mise task or the npm script of its name.
# The tools come from mise, so the entries go through `mise exec`.

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-md"
name = "Lint Markdown"
language = "system"
entry = "mise exec -- markdownlint-cli2"
files = '\.md$'

[[repos.hooks]]
id = "check-workflows"
name = "Validate the workflows"
language = "system"
entry = "mise exec -- actionlint"
files = '^\.github/workflows/.*\.ya?ml$'

[[repos.hooks]]
id = "check-schema"
name = "Validate the schemas"
language = "system"
entry = "mise exec -- jsonschema metaschema"
files = '^schema/.*\.json$'

[[repos.hooks]]
id = "check-component"
name = "Validate the component lists"
language = "system"
entry = "mise exec -- jsonschema validate schema/component.json"
files = '^data/component/.*\.json$'

[[repos.hooks]]
id = "check-card"
name = "Validate the cards"
language = "system"
entry = "mise exec -- jsonschema validate schema/card/normal.schema.json"
files = '^data/card/.*\.json$'

[[repos.hooks]]
id = "check-card-translation"
name = "Validate the card translations"
language = "system"
entry = "mise exec -- jsonschema validate schema/translation/normal.schema.json"
files = '^data/translation/card/.*\.json$'

[[repos.hooks]]
id = "check-set-translation"
name = "Validate the set translations"
language = "system"
entry = "mise exec -- jsonschema validate schema/translation/set.schema.json"
files = '^data/translation/set/.*\.json$'

[[repos.hooks]]
id = "check-print"
name = "Validate the prints"
language = "system"
entry = "mise exec -- jsonschema validate schema/print.json"
files = '^data/print/.*\.json$'

[[repos.hooks]]
id = "check-set"
name = "Validate the sets"
language = "system"
entry = "mise exec -- jsonschema validate schema/set.json"
files = '^data/set/.*\.json$'

[[repos.hooks]]
id = "check-id"
name = "Validate the ids and their references"
language = "system"
entry = "mise exec -- npm run check-id"
files = '^(data/.*\.json|scripts/.*\.ts|package\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "typecheck"
name = "Type-check the scripts"
language = "system"
entry = "mise exec -- npm run typecheck"
files = '^(scripts/.*\.ts|tsconfig\.json|package\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "Run the tests of the checks"
language = "system"
entry = "mise exec -- npm test"
files = '^(scripts/.*\.ts|package\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "check-scripts"
name = "Lint and format the scripts"
language = "system"
entry = "mise exec -- npm run check-scripts"
files = '^(scripts/.*\.ts|biome\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "check-config"
name = "Check the formatting of the configuration files"
language = "system"
entry = "mise exec -- dprint check"
files = '\.(json|jsonc|toml|ya?ml)$'
pass_filenames = false

[[repos.hooks]]
id = "check-secrets"
name = "Find secrets in the repository"
language = "system"
entry = "mise exec -- gitleaks dir . --no-banner --redact"
pass_filenames = false
