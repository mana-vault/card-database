# Hooks for this repository, run by prek (https://github.com/j178/prek).

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-md"
name = "Lint Markdown"
language = "system"
entry = "mise run check-md"
files = '\.md$'
pass_filenames = false

[[repos.hooks]]
id = "check-workflows"
name = "Validate the workflows"
language = "system"
entry = "mise run check-workflows"
files = '^\.github/workflows/.*\.ya?ml$'
pass_filenames = false

[[repos.hooks]]
id = "check-schema"
name = "Validate the schemas"
language = "system"
entry = "mise run check-schema"
files = '^schema/.*\.json$'
pass_filenames = false

[[repos.hooks]]
id = "check-data"
name = "Validate the data against the schemas"
language = "system"
entry = "mise run check-data"
files = '^(data|schema)/.*\.json$|^\.mise\.toml$'
pass_filenames = false

[[repos.hooks]]
id = "check-id"
name = "Validate the ids and their references"
language = "system"
entry = "mise run check-id"
files = '^(data/.*\.json|scripts/.*\.ts|package(-lock)?\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "typecheck"
name = "Type-check the scripts"
language = "system"
entry = "mise run typecheck"
files = '^(scripts/.*\.ts|tsconfig\.json|package(-lock)?\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "Run the tests of the checks"
language = "system"
entry = "mise run test"
files = '^(scripts/.*\.ts|package(-lock)?\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "check-scripts"
name = "Lint and format the scripts"
language = "system"
entry = "mise run check-scripts"
files = '^(scripts/.*\.ts|biome\.json|package(-lock)?\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "check-config"
name = "Check the formatting of the configuration files"
language = "system"
entry = "mise run check-config"
files = '\.(json|jsonc|toml|ya?ml)$'
pass_filenames = false

[[repos.hooks]]
id = "check-mise"
name = "Validate the mise configuration"
language = "system"
entry = "mise run check-mise"
files = '^\.mise\.toml$'
pass_filenames = false

[[repos.hooks]]
id = "check-prek"
name = "Validate the prek configuration"
language = "system"
entry = "mise run check-prek"
files = '^prek\.toml$'
pass_filenames = false

[[repos.hooks]]
id = "check-secrets"
name = "Find secrets in the repository"
language = "system"
entry = "mise run check-secrets"
pass_filenames = false

[[repos.hooks]]
id = "check-dangerous-code"
name = "Look for dangerous code"
language = "system"
entry = "mise run check-dangerous-code"
pass_filenames = false
