# Tools and checks for this repository, managed with mise (https://mise.jdx.dev/).

[tools]
node = "lts"
"aqua:dprint/dprint" = "0.63.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:j178/prek" = "0.5.5"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:sourcemeta/jsonschema" = "17.2.1"
"npm:markdownlint-cli2" = "0.23.3"

[hooks]
# Install the tools and the npm packages, and wire prek into git, whenever you enter
# the project, the way direnv does. The first run needs `mise trust`.
enter = "mise install; npm install; prek install"

[tasks.check-config]
description = "Check the formatting of the configuration files"
# dprint holds the plugins for JSON, TOML, and YAML, so one tool formats every
# hand-written configuration file. Its configuration file names what it covers.
run = "dprint check"

[tasks.check-data]
description = "Validate the data against the schemas"
# Each layer is named by the file pattern of its place in data/, so the check says
# which files it takes rather than walking whatever a directory happens to hold.
run = """
jsonschema validate schema/component.json data/component/*.json
jsonschema validate schema/set.json data/set/*.json
jsonschema validate schema/print.json data/print/*/*/*.json
jsonschema validate schema/card/normal.schema.json data/card/*/*.json
jsonschema validate schema/translation/normal.schema.json data/translation/card/*/*/*.json
jsonschema validate schema/translation/set.schema.json data/translation/set/*/*.json
"""

[tasks.check-md]
description = "Lint Markdown"
run = 'markdownlint-cli2 "**/*.md"'

[tasks.check-mise]
description = "Validate the mise configuration"
run = "mise doctor"

[tasks.check-prek]
description = "Validate the prek configuration"
run = "prek validate-config prek.toml"

[tasks.check-schema]
description = "Validate the schemas"
run = "jsonschema metaschema schema"

[tasks.check-secrets]
description = "Find secrets in the repository"
run = "gitleaks dir . --no-banner --redact"

[tasks.check-workflows]
description = "Validate the workflows"
run = "actionlint"

[tasks.format-config]
description = "Format the configuration files"
run = "dprint fmt"
